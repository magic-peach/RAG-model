# Default settings for thesis-rag.
# Every key can be overridden by an environment variable with the RAG_ prefix,
# e.g. RAG_TOP_K=8 or RAG_LLM_MODEL=llama3.1:8b. Point RAG_CONFIG at another
# YAML file to swap the whole profile.

# --- Models (all served by a local Ollama) ---
ollama_base_url: http://localhost:11434
llm_model: llama3.1:8b
embedding_model: nomic-embed-text
num_ctx: 8192
temperature: 0.1

# --- Chunking ---
chunk_size: 600        # tokens per child chunk (cl100k approximation)
chunk_overlap: 72      # ~12% of chunk_size
max_parent_tokens: 1500

# --- Retrieval ---
retrieve_k: 20         # candidates from each retriever before fusion/rerank
top_k: 5               # passages handed to the LLM
rrf_k: 60
use_bm25: true
use_reranker: true
reranker_model: BAAI/bge-reranker-base
use_multi_query: false
num_query_variants: 3
use_parent_context: true
max_passage_tokens: 1200  # longer parents are replaced by the matched chunk

# --- Ingestion ---
summarize_sections: true

# --- Storage ---
data_dir: data
