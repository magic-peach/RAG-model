# fly deploy --config deploy/fly/fly.toml   (run from the repository root)
app = "thesis-rag-magicpeach"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when idle and start it on the next request: the demo
  # costs nothing while nobody is using it, at the price of a cold start.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

# Saved chats survive restarts on a small volume.
[mounts]
  source = "thesis_rag_state"
  destination = "/home/user/state"

[[vm]]
  # The ONNX embedding model and reranker peak at ~1.3 GB, so 1 GB is not enough.
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
