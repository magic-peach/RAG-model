[project]
name = "thesis-rag"
version = "2.0.0"
description = "Local, evaluated RAG over a PhD thesis with Ollama + Llama 3.1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # PDF parsing: Markdown with headings (pymupdf4llm) + table extraction (pdfplumber)
    "pymupdf>=1.24",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    # LLM + embeddings via a local Ollama server
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "tiktoken>=0.7",
    # Retrieval: dense (Chroma), sparse (BM25), cross-encoder reranker (pulls in torch)
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    # Decision-support analysis: all numbers come from pandas/scipy, never the LLM
    "pandas>=2.2",
    "scipy>=1.13",
    # API + config
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
# Hosted demo only: Groq serves the same Llama 3.1 8B much faster than a CPU host,
# and fastembed runs nomic-embed-text (ONNX) without an Ollama server.
deploy = ["langchain-groq>=0.3", "fastembed>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thesis_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-include = ["*.ipynb"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]
addopts = "-q"
